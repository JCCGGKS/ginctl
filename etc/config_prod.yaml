# Production environment.
# Do NOT commit real secrets here; inject them via environment variables
# (e.g. AUTH_JWTSECRET=...) which override file values.
server:
  host: 0.0.0.0
  port: 8080
  mode: release               # gin mode: debug | release | test
  maxBodyBytes: 1048576       # request body cap (1 MiB)
  trustedProxies: []          # e.g. ["10.0.0.0/8"]; empty disables X-Forwarded-For trust
  readTimeoutSeconds: 15
  writeTimeoutSeconds: 15
  readHeaderTimeoutSeconds: 5
  idleTimeoutSeconds: 60
  shutdownTimeoutSeconds: 10

auth:
  jwtSecret: ""               # set via AUTH_JWTSECRET
  accessExpireSeconds: 900
  loginRateLimitPerMinute: 10

log:
  level: info
  format: json

mysql:
  host: 127.0.0.1             # override via MYSQL_HOST
  port: 3306
  user: app
  password: ""                # required: set via MYSQL_PASSWORD
  database: gin_scaffold
  charset: utf8mb4
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetimeSeconds: 300
  connMaxIdleTimeSeconds: 60

redis:
  host: 127.0.0.1             # override via REDIS_HOST
  port: 6379
  password: ""                # required: set via REDIS_PASSWORD
  db: 0
  poolSize: 100
  minIdleConns: 10
  dialTimeoutSeconds: 5
  readTimeoutSeconds: 3
  writeTimeoutSeconds: 3
  idleTimeoutSeconds: 300
