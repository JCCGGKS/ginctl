# Test environment.
server:
  env: test
  host: 0.0.0.0
  port: 8081

auth:
  jwtSecret: test-secret
  accessExpireSeconds: 900
  refreshExpireSeconds: 604800
  loginRatePerMinute: 20

cors:
  allowOrigins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowMethods: ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowHeaders: ["Authorization", "Content-Type", "X-Request-Id"] # 认证、JSON、请求追踪头
  exposeHeaders: ["X-Request-Id"] # 允许前端读取的响应头
  allowCredentials: false
  maxAgeSeconds: 600

log:
  rootDir: logs
  level: info
  format: console
  dailyRotate: true
  timezone: Asia/Shanghai
  maxSizeMB: 300
  maxAgeDays: 30
  compress: true

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  database: gin_scaffold_test
  charset: utf8mb4
  maxOpenConns: 20
  maxIdleConns: 5
  connMaxLifetimeSeconds: 300
  connMaxIdleTimeSeconds: 60

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 1
  poolSize: 20
  minIdleConns: 5
  dialTimeoutSeconds: 5
  readTimeoutSeconds: 3
  writeTimeoutSeconds: 3
  idleTimeoutSeconds: 300
