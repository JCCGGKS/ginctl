# Test environment.
server:
  host: 0.0.0.0
  port: 8081
  mode: test                  # gin mode: debug | release | test
  readTimeoutSeconds: 15
  writeTimeoutSeconds: 15
  readHeaderTimeoutSeconds: 5
  idleTimeoutSeconds: 60
  shutdownTimeoutSeconds: 10

auth:
  jwtSecret: test-secret
  accessExpireSeconds: 900

log:
  level: info
  format: console
