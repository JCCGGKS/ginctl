# Development environment. Loaded by default (env=dev).
server:
  host: 0.0.0.0
  port: 8080
  mode: debug                 # gin mode: debug | release | test

auth:
  jwtSecret: dev-secret-change-me
  accessExpireSeconds: 900

log:
  rootDir: logs
  level: debug
  format: console
  dailyRotate: false
  timezone: Asia/Shanghai
  maxSizeMB: 300
  maxAgeDays: 30
  compress: true

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""               # set via MYSQL_PASSWORD when needed
  database: gin_scaffold
  charset: utf8mb4
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetimeSeconds: 300
  connMaxIdleTimeSeconds: 60

redis:
  host: 127.0.0.1
  port: 6379
  password: ""               # set via REDIS_PASSWORD when needed
  db: 0
  poolSize: 100
  minIdleConns: 10
  dialTimeoutSeconds: 5
  readTimeoutSeconds: 3
  writeTimeoutSeconds: 3
  idleTimeoutSeconds: 300
